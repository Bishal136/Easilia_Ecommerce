name: Deploy Easilia Ecommerce to VPS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Run Deployment on VPS
        run: |
          set -e
          echo "🚀 Starting Deployment..."
          cd /var/www/Easilia_Ecommerce
          
          # ১. গিট রিপোজিটরি কনফিগ ও লেটেস্ট কোড সিঙ্ক করা (Divergent branch সমাধান)
          echo "📥 Fetching and syncing latest code from GitHub..."
          git config --global --add safe.directory /var/www/Easilia_Ecommerce || true
          git config pull.rebase false || true
          git fetch origin main
          git checkout main
          git reset --hard origin/main
          
          # ২. Backend আপডেট ও PM2 রিস্টার্ট/স্টার্ট
          echo "📦 Updating Backend..."
          cd /var/www/Easilia_Ecommerce/server
          npm install --omit=dev
          pm2 reload easilia-backend || pm2 restart easilia-backend || pm2 start src/server.js --name "easilia-backend"
          pm2 save || true
          
          # ৩. Frontend বিল্ড তৈরি
          echo "⚛️ Building Frontend..."
          cd /var/www/Easilia_Ecommerce/client
          npm install
          npm run build
          chmod -R 755 /var/www/Easilia_Ecommerce/client/dist || true
          
          # ৪. Nginx কনফিগ ভেরিফাই ও রিলোড (sudo -n দিয়ে নিরাপদ চেক)
          echo "🌐 Checking Nginx reload..."
          if sudo -n true 2>/dev/null; then
            sudo nginx -t && sudo systemctl reload nginx
            echo "✓ Nginx reloaded successfully"
          else
            echo "ℹ️ Sudo password not configured for runner; skipping nginx reload (Nginx serves built static files directly from disk)"
          fi
          
          echo "✅ Deployment Finished Successfully!"
